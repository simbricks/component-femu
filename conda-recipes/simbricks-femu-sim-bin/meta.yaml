{% set name = "simbricks-femu-sim-bin" %}

package:
  name: {{ name|lower }}
  version: {{ simbricks_version }}

source:
  # Build from the repo root, which holds the top-level Makefile and the femu/
  # submodule with the femu C sources.
  path: ../../
  patches:
    # femu calls reallocarray() (glibc >=2.26); swap it for realloc() so the
    # binary links against the older sysroot (glibc 2.17) the recipe targets.
    - fix-reallocarray.patch

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
  host:
    - simbricks-lib >=0.5.0
  run:
    # Pull in the SimBricks femu python integration so installing the simulator
    # binary also provides its orchestration glue.
    - simbricks-femu-sim-py =={{ simbricks_version }}

about:
  home: https://www.simbricks.io/
  license: GPL-2.0-or-later
  license_family: GPL2
  license_file:
    - femu/LICENSE
  summary: SimBricks-adapted femu NVMe SSD simulator.
  dev_url: https://github.com/simbricks/component-femu

extra:
  recipe-maintainers:
    - Team SimBricks <team@simbricks.io>
